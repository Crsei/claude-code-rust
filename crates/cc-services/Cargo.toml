[package]
name = "cc-services"
version = "0.1.0"
edition = "2021"
description = "Background services for cc-rust: LSP lifecycle, prompt suggestions, session memory, tool-use summaries"

[features]
default = []
telemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-langfuse",
    "dep:tracing-opentelemetry",
]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-langfuse = { workspace = true, optional = true }
chrono = { workspace = true }
dirs = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

cc-config = { workspace = true }
cc-engine = { workspace = true }
cc-session = { workspace = true }
cc-types = { workspace = true }

[dev-dependencies]
git2 = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }

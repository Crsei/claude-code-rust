[package]
name = "cc-startup"
version = "0.1.0"
edition = "2021"
description = "Process startup helpers for cc-rust."

[features]
default = []
telemetry = [
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-langfuse",
    "cc-services/telemetry",
]

[lib]
path = "src/mod.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
cc-api = { workspace = true }
cc-browser = { workspace = true }
cc-config = { workspace = true }
cc-engine = { workspace = true }
cc-lsp-service = { workspace = true }
cc-mcp = { workspace = true }
cc-models = { workspace = true }
cc-permissions = { workspace = true }
cc-plugins = { workspace = true }
cc-services = { workspace = true }
cc-tasks = { workspace = true }
cc-teams = { workspace = true }
cc-tools = { workspace = true }
cc-types = { workspace = true }
cc-worktree = { workspace = true }
dotenvy = { workspace = true }
futures = { workspace = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-langfuse = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
tempfile = { workspace = true }
